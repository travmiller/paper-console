<!doctype html>

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC-1 Settings</title>
  <script>
    // Apply the last known theme before first paint to avoid a flash.
    // The authoritative value lives in the server settings; useTheme mirrors
    // it into localStorage under "pc1-theme".
    (function () {
      try {
        var theme = localStorage.getItem('pc1-theme') || 'light';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
